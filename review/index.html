<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Review | COSMOS Encyclopedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: #f4f5f7;
      color: #343642;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .review-header {
      background: #1a1a2e;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .review-header__title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .review-header__progress {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .review-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .review-iframe {
      flex: 1;
      border: none;
      background: #fff;
    }

    .review-panel {
      width: 340px;
      flex-shrink: 0;
      background: #fff;
      border-left: 1px solid #ddd;
      padding: 24px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .review-panel__slug {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .review-panel__info {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 20px;
    }

    .review-panel__label {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .review-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .review-btn {
      padding: 12px 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      background: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .review-btn:hover { border-color: #999; }
    .review-btn--active { border-color: #1a1a2e; background: #f0f0ff; }

    .review-btn--approve.review-btn--active {
      border-color: #2e7d32;
      background: #e8f5e9;
    }

    .review-btn--correction.review-btn--active {
      border-color: #e65100;
      background: #fff3e0;
    }

    .review-btn--skip.review-btn--active {
      border-color: #666;
      background: #f5f5f5;
    }

    .correction-field {
      display: none;
      margin-bottom: 16px;
    }

    .correction-field.visible {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .review-panel.correction-mode {
      overflow: hidden;
    }

    .correction-field textarea {
      width: 100%;
      flex: 1;
      min-height: 120px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
    }

    .correction-field textarea:focus {
      outline: none;
      border-color: #e65100;
    }

    .correction-field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e65100;
    }

    .submit-btn {
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: auto;
    }

    .submit-btn:hover { background: #2a2a4e; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }

    .review-done {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .review-done h2 { margin-bottom: 8px; }
    .review-done p { color: #666; }

    .review-loading {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .error-msg {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="review-header">
    <div class="review-header__title">COSMOS Encyclopedia — Article Review</div>
    <div class="review-header__progress" id="progress"></div>
  </div>

  <div class="review-loading" id="loading">Loading assignments...</div>

  <div class="review-main" id="main" style="display: none;">
    <iframe class="review-iframe" id="articleFrame"></iframe>

    <div class="review-panel">
      <div class="review-panel__slug" id="currentSlug"></div>
      <div class="review-panel__info" id="currentInfo"></div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="review-panel__label">Your verdict:</div>

      <div class="review-actions">
        <button class="review-btn review-btn--approve" data-verdict="approved" onclick="selectVerdict(this)">
          Approve
        </button>
        <button class="review-btn review-btn--correction" data-verdict="correction" onclick="selectVerdict(this)">
          Suggest Corrections
        </button>
        <button class="review-btn review-btn--skip" data-verdict="skip" onclick="selectVerdict(this)">
          Skip (unsure)
        </button>
      </div>

      <div class="correction-field" id="correctionField">
        <label for="correctionText">What needs correcting?</label>
        <textarea id="correctionText" placeholder="Describe what should be changed..."></textarea>
      </div>

      <button class="submit-btn" id="submitBtn" disabled onclick="submitReview()">
        Submit &amp; Next
      </button>
    </div>
  </div>

  <div class="review-done" id="doneScreen">
    <div>
      <h2>All done</h2>
      <p>You have reviewed all assigned articles. Thank you!</p>
      <p id="doneSummary" style="margin-top: 12px; font-size: 0.85rem;"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
