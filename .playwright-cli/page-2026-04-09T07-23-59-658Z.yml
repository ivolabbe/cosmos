  - table [ref=e105]:
    - rowgroup [ref=e106]:
      - row [ref=e107]:
        - cell [ref=e108]:
          - heading "Proxima Centauri" [level=1] [ref=e109]
          - paragraph [ref=e110]:
            - text: This star is notable for being the
            - link "closest star" [ref=e111] [cursor=pointer]:
              - /url: "#c1"
            - text: to the sun, but its brighter neighbor
            - link "Alpha Centauri" [ref=e112] [cursor=pointer]:
              - /url: "#c2"
            - text: ", a double star, is so nearly the same distance that data about it are usually given. It is about 4"
            - link "light years" [ref=e113] [cursor=pointer]:
              - /url: ../astro/para.html#c2
            - text: distance, or about 3.8x10
            - superscript [ref=e114]: "16"
            - text: m from the sun.
          - paragraph [ref=e115]:
            - text: With its unique status as the closest star, Proxima Centauri, is an often quoted example of
            - link "parallax" [ref=e116] [cursor=pointer]:
              - /url: ../astro/para.html#c1
            - text: distance measurement. The apparent ellipse in which Proxima Centauri moves during the year as a result of the Earth's orbit around the sun is about the size of a dime observed at three miles distance. Its parallax is 0.762 arcsec, corresponding to a distance of 1.31 parsecs.
          - paragraph [ref=e117]:
            - text: Proxima Centauri is a
            - link "red dwarf star" [ref=e118] [cursor=pointer]:
              - /url: reddwa.html#c1
            - text: and as is common with red dwarfs, it is subject to
            - link "flaring" [ref=e119] [cursor=pointer]:
              - /url: reddwa.html#c2
            - text: . In March of 2016 it emitted a flare so powerful that it was visible to the naked eye (
            - link "magnitude" [ref=e120] [cursor=pointer]:
              - /url: ../astro/para.html#c5
            - text: 6.8). A planet named Proxima b was discovered around Proxima Centauri in 2016. It is our nearest neighbor planet around a different star. It orbits Proxima Centauri at a distance of roughly 7.5 million km (4.7 million miles) with an orbital period of approximately 11.2 Earth days. Its estimated mass is at least 1.3 times that of the Earth. The equilibrium temperature of Proxima b is estimated to be within the range of where water could exist as liquid on its surface, thus placing it within the habitable zone of Proxima Centauri.
          - table [ref=e121]:
            - rowgroup [ref=e122]:
              - row "Proxima Centauri has about an eighth of the mass of the sun. Faint red Proxima Centauri - at only 3,100 degrees K (5,120 F) and 500 times less bright than our sun - is nearly a fifth of a light-year from Alpha Centauri A and B. That raises some question about whether it is gravitationally bound to Alpha Centauri A and B." [ref=e123]:
