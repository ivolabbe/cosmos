                - cell "The closest star to the sun is Proxima Centauri, but its brighter neighbor Alpha Centauri, a double star, is so nearly the same distance that data about it are usually given. It is about 4 light years distance, or about 3.8x1016 m." [ref=e39]:
                  - paragraph [ref=e40]:
                    - text: The closest star to the sun is Proxima Centauri, but its brighter neighbor
                    - link "Alpha Centauri" [ref=e41] [cursor=pointer]:
                      - /url: "#c2"
                    - text: ", a double star, is so nearly the same distance that data about it are usually given. It is about 4"
