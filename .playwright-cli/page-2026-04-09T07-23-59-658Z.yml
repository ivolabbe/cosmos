          - paragraph [ref=e46]:
            - text: If our sun, which has diameter 1.392 x 10
            - superscript [ref=e47]: "9"
            - text: meters were scaled down to the size of a period on a printed page, which is nominally about 0.5 mm, then the distance to Alpha Centauri would be about 13.6 km or about 8 miles away. If the Earth were scaled to 0.5 mm diameter, then the Sun would be a ball of diameter 5.4 cm ( a little smaller than a tennis ball) at a distance of 5.9 m (19 ft). On this scale, Alpha Centauri would be 1.48 x 10
            - superscript [ref=e48]: "6"
            - text: meters or about 890 miles away. If the sun were
            - link "scaled" [ref=e49] [cursor=pointer]:
              - /url: ../nuclear/nucuni.html#c2
            - text: to a 1 foot radius, then Alpha Centauri would be about 10,300 miles away. The
            - link "parallax" [ref=e50] [cursor=pointer]:
              - /url: ../astro/para.html#c1
            - text: of Proxima Centauri as the Earth orbits the sun is about equivalent to that of a dime at a distance of 6 kilometers.
          - paragraph [ref=e51]:
            - text: There are 40 stars within 16 light years of the Earth.
            - link "Ward & Brownlee" [ref=e52] [cursor=pointer]:
              - /url: ../astro/astref.html#c1
            - text: comment that in the same space in a
            - link "globular cluster" [ref=e53] [cursor=pointer]:
              - /url: ../astro/magclo.html#c2
            - text: ", there might be 1000 or more. \"The M15 globular cluster has some 30,000 stars packed into a space only 28 light-years across.\""
