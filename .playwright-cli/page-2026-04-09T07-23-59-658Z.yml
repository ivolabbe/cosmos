  - table [ref=e151]:
    - rowgroup [ref=e152]:
      - row "Barnard's Star Barnard's star is remarkable as a red dwarf star that is the fourth closest star to the Sun after the three members of the Alpha Centauri system. It has a mass of 0.14 times the solar mass and an effective temperature of 3100K. The detection of a planet Barnard's Star b was reported in 2018, and the data provided was radius 0.4 AU and orbital period 233 days. The proposed mass is 3.2 times the mass of the Earth. It became known as a flare star when a stellar flare was observed in 1998. This star is also remarkable because it exhibits the largest proper motion, moving against the background of more distant stars by 10.3 arcseconds per year. Its distance is 1.8 parsecs = 5.9 light years. Index Nearby Stars Star Concepts Barnard's Star Wiki" [ref=e153]:
