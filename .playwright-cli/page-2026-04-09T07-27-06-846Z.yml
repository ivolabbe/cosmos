          - paragraph [ref=e216]:
            - text: This list covers all known
            - link "stars" [ref=e217] [cursor=pointer]:
              - /url: /wiki/Star
            - text: ","
            - link "white dwarfs" [ref=e218] [cursor=pointer]:
              - /url: /wiki/White_dwarf
            - text: ","
            - link "brown dwarfs" [ref=e219] [cursor=pointer]:
              - /url: /wiki/Brown_dwarf
            - text: ", and"
            - link "sub-brown dwarfs" [ref=e220] [cursor=pointer]:
              - /url: /wiki/Sub-brown_dwarf
            - text: /
            - link "rogue planets" [ref=e221] [cursor=pointer]:
              - /url: /wiki/Rogue_planet
            - text: within 20
            - link "light-years" [ref=e222] [cursor=pointer]:
              - /url: /wiki/Light-year
            - text: (6.13
            - link "parsecs" [ref=e223] [cursor=pointer]:
              - /url: /wiki/Parsec
            - text: ) of the
            - link "Sun" [ref=e224] [cursor=pointer]:
              - /url: /wiki/Sun
            - text: . So far, 131 such objects have been found. Only
            - link "22 are bright enough" [ref=e225] [cursor=pointer]:
              - /url: /wiki/List_of_nearest_bright_stars
            - text: to be visible without a telescope, for which the star's visible light needs to reach or exceed the dimmest brightness visible to the
            - link "naked eye" [ref=e226] [cursor=pointer]:
              - /url: /wiki/Naked_eye
            - text: from Earth, which is typically around 6.5
            - link "apparent magnitude" [ref=e227] [cursor=pointer]:
              - /url: /wiki/Apparent_magnitude
            - text: .
            - superscript [ref=e228]:
              - link "[1]" [ref=e229] [cursor=pointer]:
                - /url: "#cite_note-Weaver1947-1"
          - paragraph [ref=e230]:
            - text: The known 131 objects are bound in 94
            - link "stellar systems" [ref=e231] [cursor=pointer]:
              - /url: /wiki/Stellar_systems
            - text: . Of those, 103 are
            - link "main sequence stars" [ref=e232] [cursor=pointer]:
              - /url: /wiki/Main_sequence_stars
            - text: ": 80"
            - link "red dwarfs" [ref=e233] [cursor=pointer]:
              - /url: /wiki/Red_dwarf
            - text: and 23 "typical" stars having greater mass. Additionally, astronomers have found 6
            - link "white dwarfs" [ref=e234] [cursor=pointer]:
              - /url: /wiki/White_dwarf
            - text: (stars that have exhausted all fusible hydrogen), 21 brown dwarfs, as well as 1 sub-brown dwarf,
            - link "WISE 0855−0714" [ref=e235] [cursor=pointer]:
              - /url: /wiki/WISE_0855%E2%88%920714
            - text: (possibly a
            - link "rogue planet" [ref=e236] [cursor=pointer]:
              - /url: /wiki/Rogue_planet
            - text: ). The closest system is
            - link "Alpha Centauri" [ref=e237] [cursor=pointer]:
              - /url: /wiki/Alpha_Centauri
            - text: ", with"
            - link "Proxima Centauri" [ref=e238] [cursor=pointer]:
              - /url: /wiki/Proxima_Centauri
            - text: as the closest star in that system, at 4.2465 light-years from Earth. The brightest, most massive and most luminous object among those 131 is
            - link "Sirius A" [ref=e239] [cursor=pointer]:
              - /url: /wiki/Sirius_A
            - text: ", which is also the brightest star in Earth's"
            - link "night sky" [ref=e240] [cursor=pointer]:
              - /url: /wiki/Night_sky
            - text: ; its white dwarf companion Sirius B is the hottest object among them. The largest object within 20 light-years is
            - link "Procyon" [ref=e241] [cursor=pointer]:
              - /url: /wiki/Procyon
            - text: .
          - paragraph [ref=e242]:
            - text: The
            - link "Solar System" [ref=e243] [cursor=pointer]:
              - /url: /wiki/Solar_System
            - text: ", and the other stars/dwarfs listed here, are currently moving within (or near) the"
            - link "Local Interstellar Cloud" [ref=e244] [cursor=pointer]:
              - /url: /wiki/Local_Interstellar_Cloud
            - text: ", roughly 30"
            - link "light-years" [ref=e245] [cursor=pointer]:
              - /url: /wiki/Light-year
            - text: (9.2
            - link "pc" [ref=e246] [cursor=pointer]:
              - /url: /wiki/Parsec
            - text: ) across. The Local Interstellar Cloud is, in turn, contained inside the
            - link "Local Bubble" [ref=e247] [cursor=pointer]:
              - /url: /wiki/Local_Bubble
            - text: ", a cavity in the interstellar medium about 300"
            - link "light-years" [ref=e248] [cursor=pointer]:
              - /url: /wiki/Light-year
            - text: (92.0
            - link "pc" [ref=e249] [cursor=pointer]:
              - /url: /wiki/Parsec
            - text: ) across. It contains
            - link "Ursa Major" [ref=e250] [cursor=pointer]:
              - /url: /wiki/Ursa_Major_Moving_Group
            - text: and the
            - link "Hyades" [ref=e251] [cursor=pointer]:
              - /url: /wiki/Hyades_(star_cluster)
            - link "star cluster" [ref=e252] [cursor=pointer]:
              - /url: /wiki/Star_cluster
            - text: ", among others. The Local Bubble also contains the neighboring"
            - link "G-Cloud" [ref=e253] [cursor=pointer]:
              - /url: /wiki/G-Cloud
            - text: ", which contains the stars"
            - link "Alpha Centauri" [ref=e254] [cursor=pointer]:
              - /url: /wiki/Alpha_Centauri
            - text: and
            - link "Altair" [ref=e255] [cursor=pointer]:
              - /url: /wiki/Altair
            - text: . In the
            - link "galactic context" [ref=e256] [cursor=pointer]:
              - /url: /wiki/Solar_System#Galactic_context
            - text: ", the Local Bubble is a small part of the"
            - link "Orion Arm" [ref=e257] [cursor=pointer]:
              - /url: /wiki/Orion_Arm
            - text: ", which contains most stars that we can see without a telescope. The Orion Arm is one of the"
            - link "spiral arms" [ref=e258] [cursor=pointer]:
              - /url: /wiki/Spiral_arms
            - text: of our
            - link "Milky Way galaxy" [ref=e259] [cursor=pointer]:
              - /url: /wiki/Milky_Way_galaxy
            - text: .
          - generic [ref=e260]:
            - heading "Astrometrics" [level=2] [ref=e261]
            - generic [ref=e262]:
              - text: "["
              - link "edit" [ref=e263] [cursor=pointer]:
                - /url: /w/index.php?title=List_of_nearest_stars&action=edit&section=1
              - text: "]"
          - paragraph [ref=e264]:
            - text: The easiest way to determine stellar distance to the Sun for objects at these distances is
            - link "parallax" [ref=e265] [cursor=pointer]:
              - /url: /wiki/Parallax
            - text: ", which measures how much stars appear to move against background objects over the course of Earth's orbit around the Sun. As a"
            - link "parsec" [ref=e266] [cursor=pointer]:
              - /url: /wiki/Parsec
            - text: (parallax-second) is defined by the distance of an object that would appear to move exactly one
            - link "second of arc" [ref=e267] [cursor=pointer]:
              - /url: /wiki/Second_of_arc
            - text: against background objects, stars less than 5 parsecs away will have measured parallaxes of over 0.2 arcseconds, or 200 milliarcseconds. Determining past and future positions relies on accurate
            - link "astrometric" [ref=e268] [cursor=pointer]:
              - /url: /wiki/Astrometric
            - text: measurements of their parallax and total
            - link "proper motions" [ref=e269] [cursor=pointer]:
              - /url: /wiki/Proper_motion
            - text: (how far they move across the sky due to their actual velocity relative to the Sun), along with
            - link "spectroscopically" [ref=e270] [cursor=pointer]:
              - /url: /wiki/Spectroscopic
            - text: determined
            - link "radial velocities" [ref=e271] [cursor=pointer]:
              - /url: /wiki/Radial_velocities
            - text: (their speed directly towards or away from us, which combined with proper motion defines their true movement through the sky relative to the Sun). Both of these measurements are subject to increasing and significant errors over very long time spans, especially over the several thousand-year time spans it takes for stars to noticeably move relative to each other.
            - superscript [ref=e272]:
              - link "[2]" [ref=e273] [cursor=pointer]:
                - /url: "#cite_note-Matthews1994-2"
          - paragraph [ref=e274]:
            - text: Based on results from the
            - link "Gaia" [ref=e275] [cursor=pointer]:
              - /url: /wiki/Gaia_(spacecraft)
            - text: telescope's second data release from April 2018, an estimated 694 stars will approach the Solar System to less than 5
            - link "parsecs" [ref=e276] [cursor=pointer]:
              - /url: /wiki/Parsec
            - text: in the next 15 million years. Of these, 26 have a good probability to come within 1.0 parsec (3.3 light-years) and another 7 within 0.5 parsecs (1.6 light-years).
            - superscript [ref=e277]:
              - link "[3]" [ref=e278] [cursor=pointer]:
                - /url: "#cite_note-Bailer2018-3"
            - text: This number is likely much higher, due to the sheer number of stars needed to be surveyed; a star approaching the Solar System 10 million years ago, moving at a typical Sun-relative 20–200 kilometers per second, would be 600–6,000 light-years from the Sun at present day, with millions of stars closer to the Sun. The closest encounter to the Sun so far predicted is the low-mass orange dwarf star
            - link "Gliese 710" [ref=e279] [cursor=pointer]:
              - /url: /wiki/Gliese_710
            - text: / HIP 89825 with roughly 60% the mass of the Sun.
            - superscript [ref=e280]:
              - link "[4]" [ref=e281] [cursor=pointer]:
                - /url: "#cite_note-Hall2018-4"
            - text: It is currently predicted to pass
            - generic [ref=e282]: 0.1696±0.0065 ly
            - text: (
            - generic [ref=e283]: 10635±500
            - link "au" [ref=e284] [cursor=pointer]:
              - /url: /wiki/Astronomical_unit
            - text: ) from the Sun in
            - generic [ref=e285]: 1.290±0.04
            - text: million years from the present, close enough to significantly disturb the Solar System's
            - link "Oort cloud" [ref=e286] [cursor=pointer]:
              - /url: /wiki/Oort_cloud
            - text: .
            - superscript [ref=e287]:
              - link "[5]" [ref=e288] [cursor=pointer]:
                - /url: "#cite_note-resultsGaiaDR3-5"
