          - figure "Visualisation of the orbit of the Sun (yellow dot and white curve) around the Galactic Center (GC) in the last galactic year. The red dots correspond to the positions of the stars studied by the European Southern Observatory in a monitoring programme.[74]" [ref=e2995]:
            - link [ref=e2996] [cursor=pointer]:
              - /url: /wiki/File:Sun_in_orbit_around_Galactic_Centre.gif
              - img [ref=e2997]
            - generic [ref=e2998]:
              - text: Visualisation of the
              - link "orbit of the Sun" [ref=e2999] [cursor=pointer]:
                - /url: /wiki/Orbit_of_the_Sun
              - text: (yellow dot and white curve) around the
              - link "Galactic Center" [ref=e3000] [cursor=pointer]:
                - /url: /wiki/Galactic_Center
              - text: (GC) in the last
              - link "galactic year" [ref=e3001] [cursor=pointer]:
                - /url: /wiki/Galactic_year
              - text: . The red dots correspond to the positions of the stars studied by the
              - link "European Southern Observatory" [ref=e3002] [cursor=pointer]:
                - /url: /wiki/European_Southern_Observatory
              - text: in a monitoring programme.
              - superscript [ref=e3003]:
                - link "[74]" [ref=e3004] [cursor=pointer]:
                  - /url: "#cite_note-75"
          - paragraph [ref=e3005]:
            - text: Over long periods of time, the slow independent motion of stars change in both relative position and in their distance from the observer. This can cause other currently distant stars to fall within a stated range, which may be readily calculated and predicted using accurate
            - link "astrometric" [ref=e3006] [cursor=pointer]:
              - /url: /wiki/Astrometric
            - text: measurements of
            - link "parallax" [ref=e3007] [cursor=pointer]:
              - /url: /wiki/Parallax
            - text: and total
            - link "proper motions" [ref=e3008] [cursor=pointer]:
              - /url: /wiki/Proper_motion
            - text: ", along with"
            - link "spectroscopically" [ref=e3009] [cursor=pointer]:
              - /url: /wiki/Spectroscopic
            - text: determined
            - link "radial velocities" [ref=e3010] [cursor=pointer]:
              - /url: /wiki/Radial_velocities
            - text: . Although extrapolations can be made into the past or future, they are subject to increasingly significant cumulative errors over very long periods.
            - superscript [ref=e3011]:
              - link "[2]" [ref=e3012] [cursor=pointer]:
                - /url: "#cite_note-Matthews1994-2"
            - text: Inaccuracies of these measured parameters make determining the true minimum distances of any encountering stars or brown dwarfs fairly difficult.
            - superscript [ref=e3013]:
              - link "[75]" [ref=e3014] [cursor=pointer]:
                - /url: "#cite_note-76"
          - paragraph [ref=e3015]:
            - text: One of the first stars known to approach the Sun particularly close is
            - link "Gliese 710" [ref=e3016] [cursor=pointer]:
              - /url: /wiki/Gliese_710
            - text: . The star, whose mass is roughly half that of the Sun, is currently 62 light-years from the Solar System. It was first noticed in 1999 using data from the
            - link "Hipparcos" [ref=e3017] [cursor=pointer]:
              - /url: /wiki/Hipparcos
            - text: satellite, and was estimated to pass less than 1.3 light-years (0.40 pc) from the Sun in 1.4 million years.
            - superscript [ref=e3018]:
              - link "[76]" [ref=e3019] [cursor=pointer]:
                - /url: "#cite_note-77"
            - text: With the release of
            - link "Gaia" [ref=e3020] [cursor=pointer]:
              - /url: /wiki/Gaia_(spacecraft)
            - text: "'s observations of the star, it has since been refined to a much closer 0.178 light-years (0.055 pc), close enough to significantly disturb objects in the hypothetical"
            - link "Oort cloud" [ref=e3021] [cursor=pointer]:
              - /url: /wiki/Oort_cloud
            - text: ", which is thought to extend 1.2 light-years (0.37 pc) from the Sun."
            - superscript [ref=e3022]:
              - link "[77]" [ref=e3023] [cursor=pointer]:
                - /url: "#cite_note-78"
          - paragraph [ref=e3024]:
            - text: Gaia's third data release has provided updated values for many of the candidates in the table below.
