                    - text: Discovered in 1781 by William Herschel, it was the first planet found using a telescope.
                - listitem [ref=e194]:
                  - generic [ref=e195]:
                    - strong [ref=e196]: "Orbit and Rotation:"
                    - text: One day takes 17 hours, and it takes 84 Earth years to orbit the Sun. Its extreme, 21-year-long seasons are caused by its extreme tilt.
                - listitem [ref=e197]:
                  - generic [ref=e198]:
                    - strong [ref=e199]: "Atmosphere and Climate:"
                    - text: It has the coldest atmosphere in the solar system, with temperatures reaching as low as -370°F (-218°C).
                - generic [ref=e200]:
                  - listitem [ref=e201]:
                    - generic [ref=e202]:
                      - strong [ref=e203]: "Composition:"
